:26px;height:26px;vertical-align:-8px;margin-right:5px;border-radius:99px}.hide{display:none!important}@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style></head><body><div class="app" id="app"></div><div class="scrim" id="scrim"></div><div class="sheet" id="sheet"></div><script>/* =========================================================================
   AE BLASTPACK — Accelerated Experiences LLC
   Single file. No build step. State in localStorage so profiles persist.
   Skins use the AE Skin Machine 8-token core contract (--sm-*).
   ========================================================================= */
(function () {
'use strict';

/* ---------------- skins (the only two this app offers) ---------------- */
var SKINS = {
  'blastpack-light': {
    name:'Light', family:'AE Blastpack',
    vars:{'--bg':'#FDF9F0','--card':'#FFFFFF','--ink':'#1C3D4F','--mut':'#5E6D73',
          '--line':'#E4DAC4','--primary':'#1C3D4F','--accent':'#F0A3A9','--good':'#3C7C53'}
  },
  'blastpack-deep': {
    name:'Deep', family:'AE Blastpack',
    vars:{'--bg':'#14323F','--card':'#1C3D4F','--ink':'#FDF9F0','--mut':'#9FB4BD',
          '--line':'#2F5567','--primary':'#7BAEA6','--accent':'#F0A3A9','--good':'#7FD4C8'}
  }
};
function hx(h){h=h.replace('#','');if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function sx(a){return '#'+a.map(function(v){return Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0');}).join('');}
function mix(a,b,t){var A=hx(a),B=hx(b);return sx([0,1,2].map(function(i){return A[i]+(B[i]-A[i])*t;}));}
function lum(c){var r=hx(c).map(function(v){v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);});
  return 0.2126*r[0]+0.7152*r[1]+0.0722*r[2];}
function onC(c){return lum(c)>0.42?'#12161c':'#ffffff';}
function tokens(s){var v=s.vars;return{
  '--sm-bg':v['--bg'],'--sm-card':v['--card'],'--sm-ink':v['--ink'],'--sm-mut':v['--mut'],'--sm-line':v['--line'],
  '--sm-primary':v['--primary'],'--sm-primary-d':mix(v['--primary'],'#000',.18),
  '--sm-primary-soft':mix(v['--primary'],v['--bg'],.82),
  '--sm-accent':v['--accent'],'--sm-accent-d':mix(v['--accent'],'#000',.18),
  '--sm-accent-soft':mix(v['--accent'],v['--bg'],.82),
  '--sm-on-primary':onC(v['--primary']),'--sm-on-accent':onC(v['--accent']),'--sm-good':v['--good']};}
function applySkin(id){
  var s=SKINS[id]||SKINS['blastpack-light'], t=tokens(s);
  for(var k in t) document.documentElement.style.setProperty(k,t[k]);
  var m=document.querySelector('meta[name=theme-color]'); if(m) m.setAttribute('content',t['--sm-bg']);
}

/* ---------------- platforms ---------------- */
var PLATFORMS=[
  {id:'tiktok',   name:'TikTok',    cls:'g-tiktok',    ab:'TT', note:'Where it starts'},
  {id:'instagram',name:'Instagram', cls:'g-instagram', ab:'IG', note:'Reels + feed'},
  {id:'facebook', name:'Facebook',  cls:'g-facebook',  ab:'f',  note:'Your Page'},
  {id:'youtube',  name:'YouTube',   cls:'g-youtube',   ab:'YT', note:'Shorts'},
  {id:'x',        name:'X',         cls:'g-x',         ab:'X',  note:'Add-on'}
];
var P_BY={}; PLATFORMS.forEach(function(p){P_BY[p.id]=p;});
var WS_COLORS=['#7BAEA6','#F0A3A9','#E0A83A','#8E7CC3','#5B8DEF','#C8794F','#3C7C53','#C25E3A'];

/* ---------------- state ---------------- */
var KEY='aeblastpack_v1';
var S=null;
function uid(){return Math.random().toString(36).slice(2,9);}
function blankWs(name,color){
  var c={}; PLATFORMS.forEach(function(p){c[p.id]={connected:false,handle:'',expiresInDays:null};});
  return {id:uid(),name:name||'My brand',color:color||WS_COLORS[0],skin:'blastpack-light',
          logo:null,connections:c,posts:[],created:Date.now()};
}
function fresh(){
  return {v:1, onboarded:false, activeWs:null, workspaces:[],
          alerts:{push:true,email:true,sms:false,phone:'',emailAddr:''}};
}
function load(){
  try{var r=localStorage.getItem(KEY); S=r?JSON.parse(r):fresh();}catch(e){S=fresh();}
  if(!S||typeof S!=='object') S=fresh();
  if(!S.workspaces) S.workspaces=[];
  if(!S.alerts) S.alerts=fresh().alerts;
}
function save(){ try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} }
function ws(){ return S.workspaces.filter(function(w){return w.id===S.activeWs;})[0]||S.workspaces[0]||null; }
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

/* ---------------- draft (not persisted — video blobs don't belong in storage) ------- */
var draft={file:null,url:null,dur:null,caption:'',overrides:{},dests:{}};
function resetDraft(){
  if(draft.url) URL.revokeObjectURL(draft.url);
  draft={file:null,url:null,dur:null,caption:'',overrides:{},dests:{}};
  var w=ws(); if(w) PLATFORMS.forEach(function(p){ draft.dests[p.id]=!!w.connections[p.id].connected; });
}

/* ---------------- routing ---------------- */
var route='home';
function go(r){ route=r; render(); window.scrollTo({top:0,behavior:'smooth'}); }

/* ---------------- sheet ---------------- */
var scrim=document.getElementById('scrim'), sheet=document.getElementById('sheet');
function openSheet(html){ sheet.innerHTML='<div class="grab"></div>'+html;
  scrim.classList.add('on'); sheet.classList.add('on'); }
function closeSheet(){ scrim.classList.remove('on'); sheet.classList.remove('on'); }
scrim.addEventListener('click',closeSheet);

/* ---------------- helpers ---------------- */
function connectedCount(w){ return PLATFORMS.filter(function(p){return w.connections[p.id].connected;}).length; }
function expiring(w){ return PLATFORMS.filter(function(p){
  var c=w.connections[p.id]; return c.connected && c.expiresInDays!=null && c.expiresInDays<=3; }); }
function failedPosts(w){ return (w.posts||[]).filter(function(p){
  return Object.keys(p.results||{}).some(function(k){return p.results[k]==='failed';}); }); }
function fmtWhen(t){
  var d=Math.floor((Date.now()-t)/1000);
  if(d<60) return 'just now';
  if(d<3600) return Math.floor(d/60)+' min ago';
  if(d<86400) return Math.floor(d/3600)+' hr ago';
  return new Date(t).toLocaleDateString();
}
function initials(n){ return (n||'?').trim().slice(0,2).toUpperCase(); }

/* one avatar renderer everywhere: real logo if there is one, initials if not */
function avatar(w, cls, extra){
  var st='background:'+w.color+';'+(extra||'');
  if(w.logo) return '<span class="'+cls+' haslogo" style="'+st+'"><img src="'+w.logo+'" alt=""></span>';
  return '<span class="'+cls+'" style="'+st+'">'+esc(initials(w.name))+'</span>';
}

/* downscale any image to a small square data URL so profiles stay light in storage */
function readLogo(file, cb){
  var fr=new FileReader();
  fr.onload=function(){
    var img=new Image();
    img.onload=function(){
      var S2=160, c=document.createElement('canvas'); c.width=S2; c.height=S2;
      var x=c.getContext('2d');
      var side=Math.min(img.width,img.height);
      x.drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,S2,S2);
      cb(c.toDataURL('image/png'));
    };
    img.onerror=function(){ cb(null); };
    img.src=fr.result;
  };
  fr.onerror=function(){ cb(null); };
  fr.readAsDataURL(file);
}

/* =======================================================================
   VIEWS
   ======================================================================= */
var app=document.getElementById('app');

function topBar(){
  var w=ws(); if(!w) return '';
  var others=S.workspaces.filter(function(x){return x.id!==w.id;});
  var inline=others.slice(0,3), rest=others.length-inline.length;
  var h='<div class="bar">'
    + '<button class="wsbtn" data-act="wsopen" style="border-color:'+w.color+'">'
    +   avatar(w,'wsdot')
    +   '<span class="wsname">'+esc(w.name)+'</span><span class="caret">&#9660;</span>'
    + '</button>'
    + '<span class="grow"></span>';
  if(others.length){
    h+='<div class="quick">';
    inline.forEach(function(x){
      h+='<button class="qdot'+(x.logo?' haslogo':'')+'" data-act="switch" data-id="'+x.id+'" title="'+esc(x.name)+'" '
        +'style="background:'+x.color+'">'+(x.logo?'<img src="'+x.logo+'" alt="">':esc(initials(x.name)))+'</button>';
    });
    if(rest>0) h+='<button class="qdot more" data-act="wsopen">+'+rest+'</button>';
    h+='</div>';
  } else {
    h+='<button class="qdot add" data-act="newws" title="Add a profile">+</button>';
  }
  h+='<button class="iconbtn" data-act="skin" title="Light or Deep">'
    + (S.skinIsDeep?'&#9789;':'&#9788;')+'</button></div>';
  return h;
}

function tabs(){
  var w=ws(); if(!w) return '';
  var f=failedPosts(w).length, e=expiring(w).length, alerts=f+e;
  function t(id,g,label,badge){
    return '<button class="tab" data-act="go" data-r="'+id+'" aria-current="'+(route===id)+'">'

      +'<p>Renew before it lapses. This is the warning nobody else sends.</p>'

      +'<div class="row"><b style="font-size:14px">'+fmtWhen(post.at)+'</b>'

        +'<span class="glyph '+p.cls+'" style="width:24px;height:24px;font-size:10px;border-radius:7px">'+p.ab+'</span>'

/* =======================================================================
   RENDER + EVENTS
   ======================================================================= */
function render(){
  var w=ws();
  if(!S.onboarded || !w){ app.innerHTML=vOnboard(); applySkin('blastpack-light'); bindOnboard(); return; }
  applySkin(w.skin||'blastpack-light');
  S.skinIsDeep = (w.skin==='blastpack-deep');
  var body = route==='home'?vHome() : route==='queue'?vQueue() : route==='connect'?vConnect() : vSettings();
  app.innerHTML = topBar() + body + tabs();
  wire();
}

function bindOnboard(){
  var picked=WS_COLORS[0];
  app.addEventListener('click',function(e){
    var b=e.target.closest('[data-act]'); if(!b) return;
    var a=b.dataset.act;
    if(a==='pickcolor'){
      picked=b.dataset.c;
      [].forEach.call(document.querySelectorAll('#wscolors button'),function(x){
        x.style.borderWidth = (x.dataset.c===picked)?'3.5px':'2px'; });
    }
    if(a==='createfirst'){
      var nm=(document.getElementById('wsname').value||'').trim()||'My brand';
      var w=blankWs(nm,picked);
      S.workspaces.push(w); S.activeWs=w.id; S.onboarded=true; save();
      resetDraft(); route='connect'; render();
    }
  },{once:false});
}

function wire(){
  var w=ws();

  /* text fields */
  var cap=document.getElementById('cap');
  if(cap) cap.addEventListener('input',function(){ draft.caption=cap.value; });
  var ph=document.getElementById('phone');
  if(ph) ph.addEventListener('input',function(){ S.alerts.phone=ph.value; save(); });

  /* logo picker */
  var lf=document.getElementById('logofile');
  if(lf) lf.addEventListener('change',function(){
    var f=lf.files&&lf.files[0]; if(!f) return;
    readLogo(f,function(url){
      if(!url){ toast('Could not read that image.'); return; }
      var cur=ws(); cur.logo=url; save(); render(); toast('Logo saved to '+cur.name+'.');
    });
  });

  /* file picker */
  var fi=document.getElementById('file');
  if(fi) fi.addEventListener('change',function(){
    var f=fi.files&&fi.files[0]; if(!f) return;
    if(draft.url) URL.revokeObjectURL(draft.url);
    draft.file=f; draft.url=URL.createObjectURL(f); draft.dur=null;
    render();
    var v=document.querySelector('.drop.has video');
    if(v) v.addEventListener('loadedmetadata',function(){
      draft.dur=v.duration;
      var m=document.getElementById('vmeta');
      if(m) m.textContent=fmtDur(v.duration)+' · '+(v.videoWidth>v.videoHeight?'landscape':'9:16');
    });
  });

  app.onclick=function(e){
    var b=e.target.closest('[data-act]'); if(!b) return;
    var a=b.dataset.act, pid=b.dataset.p;

    if(a==='go'){ go(b.dataset.r); return; }
    if(a==='pick'){ document.getElementById('file').click(); return; }
    if(a==='clearvid'){ if(draft.url)URL.revokeObjectURL(draft.url); draft.url=null; draft.file=null; render(); return; }
    if(a==='toggle'){ draft.dests[pid]=!draft.dests[pid]; render(); return; }

    if(a==='skin'){
      w.skin = (w.skin==='blastpack-deep')?'blastpack-light':'blastpack-deep'; save(); render(); return;
    }
    if(a==='setskin'){ w.skin=b.dataset.k; save(); render(); return; }

    if(a==='override'){ sheetOverride(pid); return; }
    if(a==='wsopen'){ sheetWorkspaces(); return; }
    if(a==='switch'){ switchTo(b.dataset.id); return; }
    if(a==='newws'){ sheetNewWs(); return; }

    if(a==='connect'){ sheetConnect(pid); return; }
    if(a==='renew'){
      w.connections[pid].expiresInDays=60; save(); render();
      toast(P_BY[pid].name+' renewed. 60 days.');
      return;
    }
    if(a==='disconnect'){
      w.connections[pid]={connected:false,handle:'',expiresInDays:null};
      draft.dests[pid]=false; save(); render(); return;
    }
    if(a==='alert'){
      var k=b.dataset.k; S.alerts[k]=!S.alerts[k];
      if(k==='sms' && !S.alerts.sms) S.alerts.phone='';
      save(); render(); return;
    }
    if(a==='wscolor'){ w.color=b.dataset.c; save(); render(); return; }
    if(a==='picklogo'){ document.getElementById('logofile').click(); return; }
    if(a==='rmlogo'){ w.logo=null; save(); render(); toast('Logo removed.'); return; }
    if(a==='saveprofile'){
      var nv=(document.getElementById('rename').value||'').trim();
      if(nv) w.name=nv;
      save(); render(); toast('Saved.'); return;
    }
    if(a==='delws'){
      if(S.workspaces.length<2) return;
      S.workspaces=S.workspaces.filter(function(x){return x.id!==w.id;});
      S.activeWs=S.workspaces[0].id; save(); resetDraft(); route='home'; render(); return;
    }
    if(a==='blast'){ blast(); return; }
    if(a==='retry'){ retry(b.dataset.id,pid); return; }
    if(a==='closesheet'){ closeSheet(); return; }
  };
}

/* ---------------- sheets ---------------- */
function sheetWorkspaces(){
  var h='<h3>Your profiles</h3><p class="lede">Two taps to switch. Everything stays where you left it.</p>';
  S.workspaces.forEach(function(x){
    h+='<button class="wsrow" data-act="switch" data-id="'+x.id+'" aria-current="'+(x.id===S.activeWs)+'">'
      +'<span class="wsdot" style="background:'+x.color+'">'+esc(initials(x.name))+'</span>'
      +'<span style="flex:1"><span class="nm">'+esc(x.name)+'</span><br>'
      +'<span class="sub">'+connectedCount(x)+' of 5 connected</span></span>'
      +(x.id===S.activeWs?'<span class="st ok">here</span>':'')+'</button>';
  });
  h+='<button class="btn ghost" data-act="newws" style="margin-top:8px">+ Add another profile</button>';
  openSheet(h);
  sheet.onclick=function(e){
    var b=e.target.closest('[data-act]'); if(!b) return;
    if(b.dataset.act==='switch'){ closeSheet(); switchTo(b.dataset.id); }
    if(b.dataset.act==='newws') sheetNewWs();
  };
}

    +'<input type="text" id="nwname" placeholder="Name it" autocomplete="off">'
    +'<p class="lab" style="margin:14px 0 8px">COLOUR</p><div class="row" id="nwcolors" style="flex-wrap:wrap;gap:8px">'
    + WS_COLORS.map(function(c){return '<button data-c="'+c+'" style="width:36px;height:36px;border-radius:99px;background:'+c
      +';border:'+(c===picked?'3.5px':'2px')+' solid var(--sm-ink)"></button>';}).join('')
    +'</div>'
    +'<p class="lab" style="margin:16px 0 8px">LOGO &mdash; OPTIONAL</p>'
    +'<div class="row"><span class="wsdot" id="nwprev" style="width:52px;height:52px;font-size:18px;background:'+picked+'"></span>'
    +'<button class="btn ghost" id="nwlogo" style="flex:1;padding:11px;font-size:14px">Upload a logo</button></div>'
    +'<input type="file" id="nwlogofile" accept="image/*" class="hide">'
    +'<div style="height:16px"></div><button class="btn" id="nwgo">Create profile</button>';
  openSheet(h);
  var newLogo=null;
  var nlf=sheet.querySelector('#nwlogofile');
  nlf.addEventListener('change',function(){
    var f=nlf.files&&nlf.files[0]; if(!f) return;

    if(e.target.closest('#nwlogo')){ nlf.click(); return; }

    if(e.target.closest('#nwgo')){

      var nw=blankWs(nm,picked); nw.logo=newLogo; S.workspaces.push(nw); S.activeWs=nw.id; save();
      closeSheet(); resetDraft(); route='connect'; render();
    }

}

function sheetOverride(pid){
  var p=P_BY[pid];
  var cur = draft.overrides[pid]!=null?draft.overrides[pid]:draft.caption;
  openSheet('<h3>Caption for '+p.name+'</h3>'
    +'<p class="lede">Only this one changes. The others keep the main caption.</p>'
    +'<textarea id="ovcap">'+esc(cur)+'</textarea>'
    +'<div style="height:12px"></div>'
    +'<button class="btn" id="ovsave">Save for '+p.name+'</button>'
    +'<button class="btn ghost" id="ovclear" style="margin-top:8px">Use the main caption</button>');
  sheet.onclick=function(e){
    if(e.target.closest('#ovsave')){ draft.overrides[pid]=sheet.querySelector('#ovcap').value; closeSheet(); render(); }
    if(e.target.closest('#ovclear')){ delete draft.overrides[pid]; closeSheet(); render(); }
  };
}

function sheetConnect(pid){
  var p=P_BY[pid], w=ws();
  var steps={
    tiktok:['Tap <b>Continue</b> &mdash; TikTok opens.','Log in and tap <b>Authorize</b>.','Back in TikTok: <b>Post</b> screen &rarr; <b>More options</b> &rarr; <b>Save to device: ON</b>.'],
    instagram:['Instagram must be a <b>Professional</b> account &mdash; Business or Creator, free.','In Instagram: Settings &rarr; Account type and tools &rarr; <b>Switch to professional</b>.','Come back, tap <b>Continue</b>, log in, approve.'],
    facebook:['Tap <b>Continue</b> and log in with Facebook.','Choose which <b>Page</b> to post to.','Approve the permissions screen.'],
    youtube:['Tap <b>Continue</b> and sign in with Google.','Choose the channel.','Approve upload access.'],
    x:['Tap <b>Continue</b>, log in to X, authorize.']
  }[pid];
  var h='<h3>Connect '+p.name+'</h3><p class="lede">Saved to <b>'+esc(w.name)+'</b>. Do it once.</p>';
  steps.forEach(function(s,i){ h+='<div class="step"><span class="n">'+(i+1)+'</span><span class="t">'+s+'</span></div>'; });
  h+='<p class="note">'+helpFor(pid)+'</p><div style="height:14px"></div>'
    +'<button class="btn" id="cgo">Continue to '+p.name+'</button>'
    +'<button class="btn ghost" data-act="closesheet" style="margin-top:8px">Not now</button>';
  openSheet(h);
  sheet.onclick=function(e){
    if(e.target.closest('[data-act=closesheet]')) return closeSheet();
    if(e.target.closest('#cgo')){
      if(pid==='tiktok'){
        var wq=ws();
        location.href=bpBase()+'auth/tiktok/start?ws='+encodeURIComponent(wq.id);
        return;
      }
      var w2=ws();
      w2.connections[pid]={connected:true,handle:'@'+w2.name.toLowerCase().replace(/[^a-z0-9]+/g,''),
        expiresInDays: pid==='facebook'||pid==='instagram' ? 58 : null};
      draft.dests[pid]=true; save(); closeSheet(); render();
      toast(p.name+' connected.');
    }
  };
}

/* ---------------- real TikTok pipeline ---------------- */
function bpBase(){ var p=location.pathname; return p.slice(-1)==='/'?p:p.replace(/[^/]*$/,''); }
function setPostResult(postId,pid,val){
  var rec=ws().posts.filter(function(x){return x.id===postId;})[0];
  if(rec){ rec.results[pid]=val; save(); if(route==='queue') render(); }
}
function realTikTokPost(postId,file,caption){
  if(!file){ setPostResult(postId,'tiktok','failed'); toast('TikTok: the video left memory — pick it again.'); return; }
  if(file.size>4*1024*1024){ setPostResult(postId,'tiktok','failed'); toast('TikTok demo pipeline caps at 4 MB for now.'); return; }
  fetch(bpBase()+'api/tiktok-post?caption='+encodeURIComponent(caption||''),
        {method:'POST',headers:{'Content-Type':file.type||'video/mp4'},body:file})
  .then(function(r){return r.json();})
  .then(function(j){
    if(!j.ok) throw new Error(j.error||'post failed');
    var tries=0;
    (function poll(){
      fetch(bpBase()+'api/tiktok-status?publish_id='+encodeURIComponent(j.publish_id))
      .then(function(r){return r.json();})
      .then(function(s){
        if(s.status==='PUBLISH_COMPLETE'||s.status==='SEND_TO_USER_INBOX'){
          setPostResult(postId,'tiktok','ok'); resetDraft(); toast('TikTok: posted for real.');
        } else if(s.status==='FAILED'){
          setPostResult(postId,'tiktok','failed'); toast('TikTok failed: '+(s.reason||'unknown'));
        } else if(++tries<15){ setTimeout(poll,2000); }
        else { setPostResult(postId,'tiktok','failed'); toast('TikTok: timed out checking status.'); }
      })
      .catch(function(){ if(++tries<15) setTimeout(poll,2500); else setPostResult(postId,'tiktok','failed'); });
    })();
  })
  .catch(function(e){ setPostResult(postId,'tiktok','failed'); toast('TikTok: '+e.message); });
}

/* ---------------- blast ---------------- */
function blast(){
  var w=ws();
  var picked=PLATFORMS.filter(function(p){return draft.dests[p.id]&&w.connections[p.id].connected;});
  if(!picked.length||!draft.url) return;
  var h='<h3>Post as '+esc(w.name)+'?</h3>'
    +'<div class="wsrow" style="pointer-events:none">'+avatar(w,'wsdot','width:48px;height:48px;font-size:17px')
    +'<span><span class="nm" style="font-size:19px">'+esc(w.name)+'</span><br><span class="sub">'+picked.length+' destinations</span></span></div>'
    +'<p class="lede" style="margin-top:12px">'+picked.map(function(p){return p.name;}).join(' &middot; ')+'</p>'
    +'<button class="btn" id="bgo">Yes &mdash; blast it</button>'
    +'<button class="btn ghost" data-act="closesheet" style="margin-top:8px">Cancel</button>'
    +'<p class="note">Confirming is required by TikTok before anything is published, and it is also how you make sure you are in the right profile.</p>';
  openSheet(h);
  sheet.onclick=function(e){
    if(e.target.closest('[data-act=closesheet]')) return closeSheet();
    if(!e.target.closest('#bgo')) return;
    closeSheet();
    var post={id:uid(),at:Date.now(),caption:draft.caption,results:{}};
    picked.forEach(function(p){ post.results[p.id]='sending'; });
    w.posts.push(post); save(); route='queue'; render();
    var ttLive = picked.some(function(p){return p.id==='tiktok';}) && !!(w.connections.tiktok&&w.connections.tiktok.real);
    var f0=draft.file, cap0=(draft.overrides.tiktok!=null&&draft.overrides.tiktok!==''?draft.overrides.tiktok:draft.caption);
    var sim=picked.filter(function(p){return !(p.id==='tiktok'&&ttLive);});
    if(ttLive) realTikTokPost(post.id,f0,cap0);
    sim.forEach(function(p,i){
      setTimeout(function(){
        var live=ws(); var rec=live.posts.filter(function(x){return x.id===post.id;})[0];
        if(!rec) return;
        rec.results[p.id]='ok';
        save(); if(route==='queue') render();
        if(i===sim.length-1 && !ttLive){ resetDraft(); toast('Posted to '+picked.length+'. You heard nothing bad — that means it worked.'); }
      }, 900+i*700);
    });
  };
}
function retry(postId,pid){
  var w=ws(), rec=w.posts.filter(function(x){return x.id===postId;})[0];
  if(!rec) return;
  rec.results[pid]='sending'; save(); render();
  setTimeout(function(){ var r2=ws().posts.filter(function(x){return x.id===postId;})[0];
    if(r2){ r2.results[pid]='ok'; save(); render(); toast(P_BY[pid].name+' posted.'); } },1100);
}

/* ---------------- slick profile switching ---------------- */
function switchTo(id){
  if(id===S.activeWs){ closeSheet(); return; }
  var target=S.workspaces.filter(function(x){return x.id===id;})[0];
  if(!target) return;
  if(navigator.vibrate) try{navigator.vibrate(8);}catch(e){}

  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  S.activeWs=id; save(); resetDraft(); route='home';

  if(reduce){ render(); return; }

  var sw=document.createElement('div');
  sw.className='sweep'; sw.style.background=target.color;
  document.body.appendChild(sw);
  requestAnimationFrame(function(){ sw.classList.add('run'); });

  setTimeout(function(){ render(); flashWs(target); }, 130);
  setTimeout(function(){ sw.remove(); }, 620);
}
function flashWs(w){
  var f=document.createElement('div');
  f.className='wsflash';
  f.innerHTML=(w.logo?'<i style="background:'+w.color+';overflow:hidden"><img src="'+w.logo+'" style="width:100%;height:100%;object-fit:cover;border-radius:99px;display:block"></i>'
    :'<i style="background:'+w.color+'"></i>')+esc(w.name);
  document.body.appendChild(f);
  requestAnimationFrame(function(){ f.classList.add('on'); });
  setTimeout(function(){ f.classList.remove('on');
    setTimeout(function(){ f.remove(); },320); }, 1150);
}

/* ---------------- toast ---------------- */
var toastEl=null;
function toast(msg){
  if(toastEl) toastEl.remove();
  toastEl=document.createElement('div');
  toastEl.textContent=msg;
  toastEl.style.cssText='position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(10px);'
    +'background:var(--sm-ink);color:var(--sm-bg);padding:11px 17px;border-radius:99px;font-weight:700;'
    +'font-size:13.5px;z-index:80;max-width:88vw;text-align:center;opacity:0;'
    +'transition:opacity .25s,transform .25s cubic-bezier(.22,.61,.36,1);box-shadow:0 8px 22px #0004';
  document.body.appendChild(toastEl);
  requestAnimationFrame(function(){ toastEl.style.opacity='1'; toastEl.style.transform='translateX(-50%)'; });
  setTimeout(function(){ if(toastEl){toastEl.style.opacity='0'; setTimeout(function(){toastEl&&toastEl.remove();},300);} },2600);
}

/* ---------------- boot ---------------- */
load();
if(S.onboarded && ws()) resetDraft();
render();
window.addEventListener('pageshow',function(){ /* keep state fresh across bfcache */ });
})();
/* ---------------- TikTok OAuth return ---------------- */
(function(){
  try{
    var q=new URLSearchParams(location.search);
    if(q.get('tiktok')==='connected'){
      var wsid=q.get('ws');
      var target=S.workspaces.filter(function(x){return x.id===wsid;})[0]||ws();
      target.connections.tiktok={connected:true,real:true,handle:'@'+(q.get('handle')||'tiktok'),expiresInDays:null};
      save(); history.replaceState(null,'',location.pathname);
      render(); toast('TikTok connected for real: '+target.connections.tiktok.handle);
    } else if(q.get('tiktok')==='error'){
      history.replaceState(null,'',location.pathname);
      toast('TikTok connect failed: '+(q.get('reason')||'unknown'));
    }
  }catch(e){}
})();
